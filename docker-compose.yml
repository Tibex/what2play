services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    command: ["postgres", "-p", "55432"]
    environment:
      POSTGRES_USER: bgn_user
      POSTGRES_PASSWORD: bgn_password
      POSTGRES_DB: board_game_night
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
