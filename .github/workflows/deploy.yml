name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger deployments
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger frontend deploy (Vercel)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          # Some secrets may contain accidental whitespace/newlines; remove them to keep curl happy.
          VERCEL_HOOK_URL="$(echo "${VERCEL_DEPLOY_HOOK_URL}" | tr -d '[:space:]')"
          if [ -n "${VERCEL_HOOK_URL}" ]; then
            curl -fsS -X POST "${VERCEL_HOOK_URL}"
          fi

      - name: Trigger backend deploy (Render)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Some secrets may contain accidental whitespace/newlines; remove them to keep curl happy.
          RENDER_HOOK_URL="$(echo "${RENDER_DEPLOY_HOOK_URL}" | tr -d '[:space:]')"
          if [ -n "${RENDER_HOOK_URL}" ]; then
            curl -fsS -X POST "${RENDER_HOOK_URL}"
          fi

      - name: Fail when hooks are missing
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          VERCEL_HOOK_URL="$(echo "${VERCEL_DEPLOY_HOOK_URL}" | tr -d '[:space:]')"
          RENDER_HOOK_URL="$(echo "${RENDER_DEPLOY_HOOK_URL}" | tr -d '[:space:]')"
          if [ -z "${VERCEL_HOOK_URL}" ] && [ -z "${RENDER_HOOK_URL}" ]; then
            echo "No deploy hooks configured."
            echo "Set VERCEL_DEPLOY_HOOK_URL and/or RENDER_DEPLOY_HOOK_URL in GitHub repo secrets."
            exit 1
          fi

