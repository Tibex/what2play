name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger deployments
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger frontend deploy (Vercel)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Trigger backend deploy (Render)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Fail when hooks are missing
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' && secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "No deploy hooks configured."
          echo "Set VERCEL_DEPLOY_HOOK_URL and/or RENDER_DEPLOY_HOOK_URL in GitHub repo secrets."
          exit 1

